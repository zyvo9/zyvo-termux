name: Zyvo Termux Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --title "$tag" \
            --notes "Zyvo Termux trial build ${GITHUB_SHA:0:7}" || true
          ls -la app/build/outputs/apk/debug/
          gh release upload "$tag" app/build/outputs/apk/debug/*arm64-v8a*.apk --clobber
          gh release upload "$tag" app/build/outputs/apk/debug/*universal*.apk --clobber
