name: Zyvo Termux Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch zyvo engine
        run: |
          set -euo pipefail
          VER="1.17.9"
          BASE="https://github.com/zyvo9/ZYVO-AI/releases/download/android-v${VER}"
          curl -fsSL -o engine.zip "$BASE/zyvo-${VER}-android-aarch64.zip"
          unzip -q engine.zip
          U="data/data/com.termux/files/usr"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp "$U/libexec/zyvo/zyvo.bin" app/src/main/jniLibs/arm64-v8a/libzyvo.so
          for f in "$U"/lib/*.so; do cp "$f" app/src/main/jniLibs/arm64-v8a/; done
          chmod 755 app/src/main/jniLibs/arm64-v8a/libzyvo.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          curl -fsSL -o app/src/main/assets/skills.tar.gz "$BASE/skills.tar.gz"
          ls -la app/src/main/assets/

      - name: Build APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: >-
          ./gradlew assembleDebug --no-daemon
          -PzyvoOpencodeKey="${{ secrets.ZYVO_OPENCODE_KEY }}"
          -PzyvoGatewayKey="${{ secrets.ZYVO_GATEWAY_KEY }}"

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --title "$tag" \
            --notes "Zyvo Termux trial build ${GITHUB_SHA:0:7}" || true
          ls -la app/build/outputs/apk/debug/
          gh release upload "$tag" app/build/outputs/apk/debug/*arm64-v8a*.apk --clobber
          gh release upload "$tag" app/build/outputs/apk/debug/*universal*.apk --clobber
